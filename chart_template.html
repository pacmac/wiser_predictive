<title>Heating Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a headline in words, two big panels (inside, outside) on one time axis, heating shaded across both. Nothing else. */
:root{
  --bg:#f4f6f4; --panel:#ffffff; --ink:#18211f; --muted:#5a6763; --grid:#e1e7e4; --axis:#b9c4bf;
  --in:#123f8c; --out:#0b7a85; --heat:rgba(214,96,48,.20); --heat-ink:#b8481f; --fc:rgba(11,122,133,.06);
  --btn:#e8eeeb; --btn-on:#18211f; --btn-on-ink:#f4f6f4;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101615; --panel:#171f1d; --ink:#e4ebe8; --muted:#93a29d; --grid:#26322f; --axis:#46544f;
  --in:#7ea6ff; --out:#4cc4cf; --heat:rgba(238,122,92,.22); --heat-ink:#ee7a5c; --fc:rgba(76,196,207,.07);
  --btn:#222d2a; --btn-on:#e4ebe8; --btn-on-ink:#101615; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#101615; --panel:#171f1d; --ink:#e4ebe8; --muted:#93a29d; --grid:#26322f; --axis:#46544f;
  --in:#7ea6ff; --out:#4cc4cf; --heat:rgba(238,122,92,.22); --heat-ink:#ee7a5c; --fc:rgba(76,196,207,.07);
  --btn:#222d2a; --btn-on:#e4ebe8; --btn-on-ink:#101615; color-scheme: dark; }
body{ background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:15px; line-height:1.5;
  padding-block:20px 32px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
main{ max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
.bar{ display:flex; flex-wrap:wrap; gap:10px 20px; align-items:flex-start; justify-content:space-between; }
h1{ font-size:22px; font-weight:600; margin:0; }
.btns{ display:flex; gap:6px; }
button{ font:inherit; font-weight:500; color:var(--ink); background:var(--btn); border:0; border-radius:6px; padding:6px 14px; cursor:pointer; }
button[aria-pressed="true"]{ background:var(--btn-on); color:var(--btn-on-ink); }
button:focus-visible{ outline:2px solid var(--in); outline-offset:2px; }
.story{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
.story > div{ background:var(--panel); border-radius:8px; padding:12px 14px; min-width:0; }
.story .k{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
.story .k i{ width:18px; border-top:3px solid; }
.story .v{ font-size:19px; font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums; }
.story .d{ color:var(--muted); font-size:13px; }
#readout{ background:var(--panel); border-radius:6px; padding:8px 12px; min-height:2.6em; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:13px;
  font-variant-numeric:tabular-nums; position:sticky; top:env(safe-area-inset-top,0px); z-index:5; }
#chart{ background:var(--panel); border-radius:8px; padding:8px 0; }
svg{ display:block; width:100%; touch-action:pan-y; }
svg text{ fill:var(--muted); font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:12px; }
svg text.pt{ fill:var(--ink); font-weight:600; font-size:14px; }
svg text.heat{ fill:var(--heat-ink); font-weight:600; font-size:11px; }
svg text.mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; }
.note{ color:var(--muted); font-size:13px; max-width:80ch; }
</style>
<main>
  <div class="bar">
    <h1 id="title">Lounge</h1>
    <div class="btns" role="group" aria-label="Time window">
      <button data-days="3" aria-pressed="true">3 days</button><button data-days="10" aria-pressed="false">10 days</button>
    </div>
  </div>
  <div class="story" id="story"></div>
  <div id="readout">Move over the chart to read the values at that time.</div>
  <div id="chart"></div>
  <p class="note" id="note"></p>
</main>
<script>
const D = /*DATA*/null;
const state = { days: 3 };
const root = document.getElementById('chart');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtT = (t, o) => new Date(t * 1000).toLocaleString([], o);
const hhmm = t => fmtT(t, { hour: '2-digit', minute: '2-digit', hour12: false });
const num = (v, d = 1) => (v === null || v === undefined || Number.isNaN(v)) ? '–' : v.toFixed(d);

/* The heating shown is the room's own heat-up: Wiser's heating and boost spans merged, short gaps (under 20 min) closed
   so one heat-up is one band. 20 min is longer than a boost (14-15 min) and shorter than the gap between separate heat-ups. */
const MERGE_GAP = 20 * 60;
function heatSpans() {
  const all = [...D.heating, ...D.boost].filter(([a, b]) => b > a).sort((p, q) => p[0] - q[0]), out = [];
  for (const [a, b] of all) { const last = out[out.length - 1]; if (last && a - last[1] <= MERGE_GAP) last[1] = Math.max(last[1], b); else out.push([a, b]); }
  return out;
}
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * p).find(s => s >= raw) || raw, out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function visible(data, x0, x1) {
  const out = []; let before = null;
  for (const p of data) { if (p[0] < x0) before = p; else if (p[0] <= x1) out.push(p); }
  if (before) out.unshift([x0, before[1]]);
  return out;
}
function at(data, t, step) {
  let lo = 0, hi = data.length - 1, i = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (data[m][0] <= t) { i = m; lo = m + 1; } else hi = m - 1; }
  if (i < 0) return null;
  if (i === data.length - 1) return t - data[i][0] > 2 * 86400 ? null : data[i][1];
  if (step) return data[i][1];
  const [t0, v0] = data[i], [t1, v1] = data[i + 1];
  return t1 - t0 > 6 * 3600 ? v0 : v0 + (v1 - v0) * (t - t0) / (t1 - t0);
}
const within = (data, x0, x1) => data.filter(p => p[0] >= x0 && p[0] <= x1).map(p => p[1]);

/* Two panels. Inside is zoomed to its own range (with a little room) so the movement is visible. */
const PANELS = [
  { id: 'in', h: 260, title: 'Inside the lounge, °C', color: '--in', lines: () => [{ data: D.reading, w: 2.6 }] },
  { id: 'out', h: 170, title: 'Outside, °C', color: '--out', lines: () => [{ data: D.outside, w: 2.4 }, { data: D.forecast, w: 2.4, dash: '6 4' }] },
];
const LEFT = 46, RIGHT = 12, TITLE = 24, GAP = 14, AXIS = 30;

function render() {
  const W = Math.max(320, root.clientWidth), x0 = D.now - state.days * 86400, x1 = D.end;
  const X = t => LEFT + (t - x0) / (x1 - x0) * (W - LEFT - RIGHT);
  const heats = heatSpans().filter(([, b]) => b > x0);
  let y = 4, body = '', first = null;
  for (const p of PANELS) {
    const vals = p.lines().flatMap(l => visible(l.data, x0, x1).map(q => q[1]));
    let lo = Math.min(...vals), hi = Math.max(...vals); const pad = Math.max((hi - lo) * .12, .4); lo -= pad; hi += pad;
    const top = y + TITLE, bot = top + p.h, Y = v => bot - (v - lo) / (hi - lo) * p.h;
    first = first || top;
    body += `<text class="pt" x="${LEFT}" y="${y + 16}">${p.title}</text>`;
    for (const v of niceTicks(lo, hi, 4)) body += `<line x1="${LEFT}" x2="${W - RIGHT}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--grid')}"/><text class="mono" x="${LEFT - 8}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(v % 1 ? 1 : 0)}°</text>`;
    const nowX = X(D.now);
    body += `<rect x="${nowX}" y="${top}" width="${W - RIGHT - nowX}" height="${p.h}" fill="${css('--fc')}"/>`;
    for (const [a, b] of heats) body += `<rect x="${X(Math.max(a, x0))}" y="${top}" width="${Math.max(2, X(b) - X(Math.max(a, x0)))}" height="${p.h}" fill="${css('--heat')}"/>`;
    body += `<clipPath id="c-${p.id}"><rect x="${LEFT}" y="${top}" width="${W - LEFT - RIGHT}" height="${p.h}"/></clipPath><g clip-path="url(#c-${p.id})">`;
    for (const l of p.lines()) {
      const pts = visible(l.data, x0, x1); if (!pts.length) continue;
      body += `<path d="${pts.map(([t, v], i) => (i ? 'L' : 'M') + X(t) + ' ' + Y(v)).join(' ')}" fill="none" stroke="${css(p.color)}" stroke-width="${l.w}" ${l.dash ? `stroke-dasharray="${l.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    body += '</g>';
    if (p.id === 'out') body += `<text x="${X(D.now) + 6}" y="${top + 14}">forecast →</text>`;
    y = bot + GAP;
  }
  const bottom = y - GAP, stepH = (state.days <= 3 ? 6 : 24) * (W < 600 ? 2 : 1);
  const f = new Date(x0 * 1000); f.setMinutes(0, 0, 0); f.setHours(Math.ceil((f.getHours() + 1) / stepH) * stepH);
  for (let d = f; d.getTime() / 1000 <= x1; d = new Date(d.getTime() + stepH * 3600e3)) {
    const t = d.getTime() / 1000, mid = d.getHours() === 0;
    body += `<line x1="${X(t)}" x2="${X(t)}" y1="${first}" y2="${bottom}" stroke="${css(mid ? '--axis' : '--grid')}" stroke-width="${mid ? 1 : .5}"/>`;
    body += `<text x="${X(t)}" y="${bottom + 16}" text-anchor="middle">${mid ? fmtT(t, { weekday: 'short', day: 'numeric' }) : String(d.getHours()).padStart(2, '0') + ':00'}</text>`;
  }
  let lastLabel = -1e9;  // label a heat-up only if there is room for it after the previous label (the text is about 95 px wide)
  if (state.days <= 3) for (const [a] of heats) if (a >= x0 && X(a) - lastLabel > 100) { body += `<text class="heat" x="${X(a) + 3}" y="${first + 12}">heating ${hhmm(a)}</text>`; lastLabel = X(a); }
  const nowX = X(D.now);
  body += `<line x1="${nowX}" x2="${nowX}" y1="${first}" y2="${bottom}" stroke="${css('--ink')}" stroke-width="1.5"/><text class="pt" x="${nowX}" y="${first - 6}" text-anchor="middle">now</text>`;
  body += `<line id="hv" x1="0" x2="0" y1="${first}" y2="${bottom}" stroke="${css('--ink')}" stroke-dasharray="2 3" visibility="hidden"/>`;
  const H = bottom + AXIS;
  root.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Inside and outside temperature, with the periods the heating was on shaded">${body}</svg>`;
  const svg = root.querySelector('svg'), hv = svg.querySelector('#hv');
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    if (px < LEFT || px > W - RIGHT) return;
    const t = x0 + (px - LEFT) / (W - LEFT - RIGHT) * (x1 - x0);
    hv.setAttribute('x1', px); hv.setAttribute('x2', px); hv.setAttribute('visibility', 'visible');
    const future = t > D.now, h = heats.some(([a, b]) => t >= a && t <= b);
    document.getElementById('readout').innerHTML = future
      ? `${fmtT(t, { weekday: 'short', hour: '2-digit', minute: '2-digit' })} · forecast outside ${num(at(D.forecast, t, false))}°`
      : `${fmtT(t, { weekday: 'short', hour: '2-digit', minute: '2-digit' })} · inside ${num(at(D.reading, t, true))}° · outside ${num(at(D.outside, t, true))}° · heating ${h ? 'ON' : 'off'}`;
  };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
}

function story() {
  const x0 = D.now - state.days * 86400, days = state.days;
  const sum = (data, label, colorVar) => {
    const v = within(data, x0, D.now); if (!v.length) return '';
    const start = at(data, x0, true) ?? v[0], now = v[v.length - 1], lo = Math.min(...v), hi = Math.max(...v);
    const change = now - start;
    return `<div><div class="k"><i style="border-color:var(${colorVar})"></i>${label}</div>
      <div class="v">${num(now)}° now</div>
      <div class="d">${days} days ago ${num(start)}°, lowest ${num(lo)}°, highest ${num(hi)}°. ${Math.abs(change) < .15 ? 'About the same.' : change < 0 ? `Down ${num(-change)}°.` : `Up ${num(change)}°.`}</div></div>`;
  };
  const heats = heatSpans().filter(([, b]) => b > x0), mins = Math.round(heats.reduce((s, [a, b]) => s + (Math.min(b, D.now) - Math.max(a, x0)) / 60, 0));
  const when = heats.length ? heats.slice(-3).map(([a]) => fmtT(a, { weekday: 'short', hour: '2-digit', minute: '2-digit' })).join(', ') : '';
  document.getElementById('story').innerHTML = sum(D.reading, 'Inside the lounge', '--in') + sum(D.outside, 'Outside', '--out') +
    `<div><div class="k"><i style="border-color:var(--heat-ink)"></i>Heating on</div>
      <div class="v">${heats.length} ${heats.length === 1 ? 'time' : 'times'}, ${mins} min in all</div>
      <div class="d">${heats.length ? `Latest: ${when}.` : 'It did not come on.'}</div></div>`;
}

function init() {
  document.getElementById('title').textContent = D.room.charAt(0).toUpperCase() + D.room.slice(1);
  document.getElementById('note').textContent = `Recorded history up to ${fmtT(D.now, { weekday: 'short', hour: '2-digit', minute: '2-digit' })}; the outside forecast is the weather service's hourly forecast. Heating is the room's boost and heating spans from Wiser. Built ${D.built.replace('T', ' ').replace('+00:00', ' UTC')}. The prediction is added to this chart in the next stage.`;
  document.querySelectorAll('button[data-days]').forEach(b => b.addEventListener('click', () => {
    state.days = +b.dataset.days; document.querySelectorAll('button[data-days]').forEach(o => o.setAttribute('aria-pressed', o === b));
    story(); render();
  }));
  let tm; window.addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(render, 80); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  story(); render();
}
init();
</script>
