<title>Predictive Heating</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Development preview only: a stand-in for Home Assistant around the same panel.js that the sidebar panel runs. */
:root{ --primary-background-color:#f4f6f4; --card-background-color:#ffffff; --primary-text-color:#18211f; --secondary-text-color:#5a6763; --divider-color:#e1e7e4; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --primary-background-color:#101615; --card-background-color:#171f1d; --primary-text-color:#e4ebe8; --secondary-text-color:#93a29d; --divider-color:#26322f; color-scheme:dark; } }
:root[data-theme="dark"]{ --primary-background-color:#101615; --card-background-color:#171f1d; --primary-text-color:#e4ebe8; --secondary-text-color:#93a29d; --divider-color:#26322f; color-scheme:dark; }
body{ margin:0; background:var(--primary-background-color); }
</style>
<script>/*PANEL*/</script>
<script>
const DATA = /*DATA*/null;
const ROOMS = /*ROOMS*/null;
const start = () => {
  const panel = document.createElement('wiser-predictive-panel');
  document.body.appendChild(panel);
  const dark = window.matchMedia('(prefers-color-scheme: dark)');
  const hass = () => ({ themes: { darkMode: dark.matches }, config: { time_zone: window.HOUSE_TZ || 'UTC' }, callWS: async (m) => (m.type.endsWith('/rooms') ? ROOMS : DATA) });
  panel.hass = hass();
  dark.addEventListener('change', () => { panel.hass = hass(); });
};
if (document.body) start(); else window.addEventListener('DOMContentLoaded', start);
</script>
